<html lang="en">
	<head>
		<script>
			//ensures a password is entered
			function validatePass(){
			var password=document.forms["userForm"]["Pass"].value;
				if (password==null || password===""){
					document.getElementById('errorPassword').innerHTML = 'Please enter a password.';
				}
				else{
					document.getElementById('errorPassword').innerHTML = '';
				}
			}
			//ensures an email is entered
			function validateEmail(){
			var email=document.forms["userForm"]["Email"].value;
			var atPosition=email.indexOf("@");
			var dotPosition=email.lastIndexOf(".");
				if (atPosition<1 || dotPosition<atPosition+2 || dotPosition+2>=email.length){
					document.getElementById('errorEmail').innerHTML = 'Please enter a valid email address.';
					}
				else{
					document.getElementById('errorEmail').innerHTML = '';
				}
			}
			//form to collect post for php page
		</script>
	</head>
	<body>
		<form action="Register.php" method="post" name="userForm">
			Forename:<input type="text" name="forename"></br>
			Surname:<input type="text" name="surname"></br>
			Student Number:<input type="text" name="student_number"></br>
			House:<input type="text" name="house"></br>
			Street:<input type="text" name="street"></br>
			Town:<input type="text" name="town"></br>
			Postcode:<input type="text" name="postcode"></br>
			Email:<input type="text" name="email" onBlur="validateEmail();"><div id="errorEmail"style="color: red;"></div></br>
			Password:<input type="password" name="Password" onBlur="validatePass();"><div id="errorPassword"style="color: red;"></div></br>
			<input type="submit" name="submit" value="Submit">
		</form>
	</body>
</html>
